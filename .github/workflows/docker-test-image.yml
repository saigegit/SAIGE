name: Build test Docker image

# Builds docker/Dockerfile natively on an x86-64 runner and pushes a TEST image to Docker Hub.
# Runs on pushes to this branch and manually (workflow_dispatch).
# Requires repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches: [docker-test-image]
  workflow_dispatch:

env:
  IMAGE: wzhou88/saige
  TAG: 1.5.3-test-noadjCov

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ env.TAG }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ env.TAG }} step2_SPAtests.R --help | grep -A2 "is_noadjCov"
          docker run --rm ${{ env.IMAGE }}:${{ env.TAG }} Rscript -e 'library(SAIGE); cat("SAIGE", as.character(packageVersion("SAIGE")), "\n")'
